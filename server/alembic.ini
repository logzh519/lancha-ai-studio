# Keep this file ASCII-only: alembic reads it with the OS locale encoding (GBK on Chinese Windows).
#
# One section per migration branch. Each branch owns one PostgreSQL schema and its own
# alembic_version table inside that schema, so branches never block each other:
#
#   alembic -n platform upgrade head     -> schema "platform"
#   alembic -n example_a upgrade head    -> schema "mod_example_a"
#
# The [alembic] section below is not bound to any branch and cannot be used directly.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = newline

[platform]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = newline
version_locations = %(here)s/platforms/migrations/versions

[example_a]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = newline
version_locations = %(here)s/modules/example_a/migrations/versions

[tiktok_studio]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = newline
version_locations = %(here)s/modules/tiktok_studio/migrations/versions


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
